<text x="398" y="126" fill="#8fa6ba" font-size="3.4" font-family="sans-serif">× 1</text>
<text x="314" y="146" fill="#3ddc97" font-size="5" font-weight="700" font-family="sans-serif">装配顺序</text>
<text x="314" y="156" fill="#cfe0ee" font-size="3.6" font-family="sans-serif">1 底板三层交错叠，点胶压平，四周贴胶带</text>
<text x="314" y="164" fill="#cfe0ee" font-size="3.6" font-family="sans-serif">2 支座：上下纸皮夹 6 段筷子，四角扎带绑死</text>
<text x="314" y="172" fill="#cfe0ee" font-size="3.6" font-family="sans-serif">3 支座粘到底板 (167,75)，压重物 10 分钟</text>
<text x="314" y="180" fill="#cfe0ee" font-size="3.6" font-family="sans-serif">4 顶板开 13 宽梁槽，梁塞进去，压条+扎带绑死</text>
<text x="314" y="188" fill="#cfe0ee" font-size="3.6" font-family="sans-serif">5 秤台夹筷子，中心孔扎带绑到梁受力孔</text>
<text x="314" y="196" fill="#cfe0ee" font-size="3.6" font-family="sans-serif">6 管架筷子插孔灌胶，三面贴三角斜撑</text>
<text x="314" y="204" fill="#cfe0ee" font-size="3.6" font-family="sans-serif">7 泵垫海绵后扎带绑；模块用双面胶</text>
<text x="314" y="212" fill="#cfe0ee" font-size="3.6" font-family="sans-serif">8 空秤去皮，读数应是 0.0 ± 0.5</text>
<text x="314" y="232" fill="#e5484d" font-size="4" font-weight="700" font-family="sans-serif">三个会失准的坑</text>
<text x="314" y="242" fill="#8fa6ba" font-size="3.5" font-family="sans-serif">① 底板不平 —— 会随压力方向漂零点</text>
<text x="314" y="250" fill="#8fa6ba" font-size="3.5" font-family="sans-serif">② 热熔胶蠕变 —— 梁只靠胶粘，第二天必飘</text>
<text x="314" y="258" fill="#8fa6ba" font-size="3.5" font-family="sans-serif">③ 纸皮受潮 —— 楞向吸湿后强度掉一半</text>
<text x="18" y="285" fill="#e5484d" font-size="4" font-family="sans-serif">━ 切穿</text>
<text x="42" y="285" fill="#4cc9f0" font-size="4" font-family="sans-serif">○ 孔（十字是孔心）</text>
<text x="94" y="285" fill="#a78bfa" font-size="4" font-family="sans-serif">┈ 零件占位，不切</text>
<text x="154" y="285" fill="#ff9f1c" font-size="4" font-family="sans-serif">┅ 支座范围 / 折线</text>
