<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>RiceMix</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0d1117; --card:#161b22; --line:#21262d; --ink:#e6edf3;
  --dim:#7d8590; --ok:#3fb950; --warn:#d29922; --bad:#f85149;
  --acc:#e45b24;
}
html,body{margin:0;height:100%}
body{
  background:var(--bg); color:var(--ink);
  font:16px/1.45 -apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif;
  padding:14px 14px calc(14px + env(safe-area-inset-bottom));
  max-width:560px; margin:0 auto;
}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
h1{font-size:19px;margin:0;letter-spacing:-.3px}
.pill{font-size:11.5px;padding:4px 9px;border-radius:20px;background:var(--card);
  border:1px solid var(--line);color:var(--dim);white-space:nowrap;flex:0 0 auto}
.pill.on{color:var(--ok);border-color:#238636}
.pill.off{color:var(--bad);border-color:#8b2c26}

.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:11px}
.lbl{font-size:11.5px;color:var(--dim);letter-spacing:.4px;text-transform:uppercase;margin-bottom:3px}
.big{font-size:42px;font-weight:700;letter-spacing:-1.6px;line-height:1.05;font-variant-numeric:tabular-nums}
.big small{font-size:17px;font-weight:500;color:var(--dim);letter-spacing:0;margin-left:3px}
.sub{font-size:13px;color:var(--dim);margin-top:4px;min-height:18px}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.cell{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
.cell .v{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px}
.cell .v.g{color:var(--ok)} .cell .v.o{color:var(--acc)} .cell .v.b{color:var(--bad)}

#bar{height:7px;border-radius:4px;background:#21262d;overflow:hidden;margin-top:11px}
#bar>i{display:block;height:100%;width:0;background:var(--acc);transition:width .25s}

.acts{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:11px}
button{
  font:600 15.5px -apple-system,'Microsoft YaHei',sans-serif;
  padding:15px 10px;border-radius:11px;border:0;color:#fff;cursor:pointer;
  transition:transform .07s,filter .15s;
}
button:active{transform:scale(.97)}
button:disabled{opacity:.35}
.b1{background:#238636} .b2{background:#30363d} .b3{background:#da3633}

.row{display:flex;justify-content:space-between;align-items:center;
  padding:9px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.row:last-child{border:0;padding-bottom:0}
.row b{font-variant-numeric:tabular-nums}

input[type=number]{
  width:100%;padding:12px;border-radius:9px;border:1px solid #30363d;
  background:var(--bg);color:var(--ink);font-size:16px;margin-top:7px
}
input[type=number]:focus{outline:0;border-color:var(--acc)}

#log{font:11.5px/1.5 Consolas,monospace;color:var(--dim);
  max-height:150px;overflow-y:auto;white-space:pre-wrap;word-break:break-all}
#log b{color:var(--ink)}

canvas{width:100%;height:88px;display:block;margin-top:6px}

.hint{font-size:12px;color:var(--dim);line-height:1.55}
.hint code{background:#21262d;padding:1.5px 5px;border-radius:4px;font-size:11.5px}

#conn{display:none}
#conn.show{display:block}
</style>
</head>
<body>

<header>
  <h1>RiceMix</h1>
  <span class="pill off" id="link">未连接</span>
</header>

<!-- connection picker, shown until we have a channel -->
<div class="card show" id="conn">
  <div class="lbl">连接方式</div>

  <button class="b1" id="btnUsb" style="width:100%;margin-top:9px">USB 数据线</button>
  <div class="hint" style="margin-top:6px">
    不用网络，插上就能用。需要 Chrome 或 Edge 浏览器。
  </div>

  <button class="b2" id="btnWifi" style="width:100%;margin-top:14px">WiFi 局域网</button>
  <input type="text" id="ip" placeholder="192.168.4.1" value="192.168.4.1"
         style="width:100%;padding:12px;border-radius:9px;border:1px solid #30363d;
                background:var(--bg);color:var(--ink);font-size:16px;margin-top:7px">
  <button class="b1" id="btnWifiGo" style="width:100%;margin-top:9px">连接这个地址</button>
  <div class="hint" style="margin-top:6px">
    连机器自己开的热点 <code>RiceMix</code> 时填 <code>192.168.4.1</code>；
    连同一个路由器时填 LCD 第二页显示的那个 IP。
  </div>
</div>

<!-- main readout -->
<div class="card">
  <div class="lbl">秤上读数</div>
  <div class="big" id="w">--<small>g</small></div>
  <div class="sub" id="st">--</div>
  <div id="bar"><i></i></div>
</div>

<div class="grid" style="margin-bottom:11px">
  <div class="cell"><div class="lbl">目标加水</div><div class="v o" id="tgt">--</div></div>
  <div class="cell"><div class="lbl">已经加了</div><div class="v g" id="add">--</div></div>
  <div class="cell"><div class="lbl">米重</div><div class="v" id="rice">--</div></div>
  <div class="cell"><div class="lbl">水箱</div><div class="v" id="wl">--</div></div>
</div>

<div class="acts">
  <button class="b1" id="bStart">开始配料</button>
  <button class="b3" id="bStop">停止</button>
  <button class="b2" id="bTare">去皮</button>
  <button class="b2" id="bClear">清故障</button>
</div>

<div class="card">
  <div class="lbl">重量曲线 · 最近 60 秒</div>
  <canvas id="cv" width="520" height="176"></canvas>
</div>

<div class="card">
  <div class="lbl">米水比</div>
  <div class="row"><span>当前</span><b id="ratio">1 : 1.20</b></div>
  <input type="number" id="ri" step="0.05" min="1" max="3" value="1.2">
  <button class="b1" id="bRatio" style="width:100%;margin-top:9px">写入</button>
  <div class="hint" style="margin-top:6px">
    1.1 偏硬 · 1.2 正常 · 1.6 软饭 · 2.5 稀饭。写进 EEPROM，断电不丢。
  </div>
</div>

<div class="card">
  <div class="lbl">日志</div>
  <div id="log"></div>
</div>

<script>
/* ==========================================================================
   RiceMix companion app
   One UI, two transports:
     USB  — Web Serial, plain-text commands, JSON state lines every 2 s
     WiFi — HTTP polling against the ESP32's own web server
   They carry the same command words, so nothing above this line changes.
   ========================================================================== */

const $ = (id) => document.getElementById(id);
const link = $('link'), conn = $('conn');
let mode = null;            // 'usb' | 'wifi' | null
let writer = null;          // Web Serial writer
let base = '';              // WiFi base URL
let pollTimer = null;
let last = { w: 0, rice: 0, target: 0, added: 0, ratio: 1.2, water: 0, state: 'IDLE', fault: '' };
const hist = [];            // {t, w}
const HIST_MS = 60000;

/* ---------- logging -------------------------------------------------- */
function log(msg, kind) {
  const el = $('log');
  const t = new Date().toLocaleTimeString('zh-CN', { hour12: false });
  const line = document.createElement('div');
  line.innerHTML = `<b>${t}</b>  ${msg}`;
  el.appendChild(line);
  while (el.children.length > 60) el.removeChild(el.firstChild);
  el.scrollTop = el.scrollHeight;
}

/* ---------- render --------------------------------------------------- */
function render(d) {
  last = Object.assign(last, d);

  const stTxt = {
    IDLE:  '待机 · 放米后按开始',
    FILL:  '正在加水…',
    DONE:  '完成',
    FAULT: '故障：' + (d.fault || '未知')
  }[d.state] || d.state;

  $('w').innerHTML = d.w.toFixed(1) + '<small>g</small>';
  $('st').textContent = stTxt;
  $('st').style.color = d.state === 'FAULT' ? 'var(--bad)'
                      : d.state === 'DONE'  ? 'var(--ok)'
                      : d.state === 'FILL'  ? 'var(--acc)' : 'var(--dim)';

  $('tgt').textContent  = d.target.toFixed(1) + ' g';
  $('add').textContent  = d.added.toFixed(1) + ' g';
  $('rice').textContent = d.rice ? d.rice.toFixed(1) + ' g' : '--';
  $('wl').textContent   = Math.round(d.water) + ' mm';
  $('wl').className     = 'v ' + (d.water < 5 ? 'b' : '');

  $('ratio').textContent = '1 : ' + d.ratio.toFixed(2);

  const frac = d.target > 0 ? Math.min(1, Math.max(0, d.added / d.target)) : 0;
  $('bar').firstElementChild.style.width = (frac * 100) + '%';
  $('bar').firstElementChild.style.background =
    d.state === 'FAULT' ? 'var(--bad)' : d.state === 'DONE' ? 'var(--ok)' : 'var(--acc)';

  pushHist(d.w);
  drawCurve();
}

function pushHist(w) {
  const now = Date.now();
  hist.push({ t: now, w });
  while (hist.length && now - hist[0].t > HIST_MS) hist.shift();
}

function drawCurve() {
  const cv = $('cv'), ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height, pad = 6;
  ctx.clearRect(0, 0, W, H);

  if (hist.length < 2) {
    ctx.fillStyle = '#30363d';
    ctx.font = '13px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText('等待数据…', W / 2, H / 2);
    return;
  }

  const t1 = Date.now(), t0 = t1 - HIST_MS;
  let lo = Infinity, hi = -Infinity;
  hist.forEach(p => { lo = Math.min(lo, p.w); hi = Math.max(hi, p.w); });
  if (hi - lo < 20) { const m = (hi + lo) / 2; lo = m - 10; hi = m + 10; }
  const padY = (hi - lo) * 0.15; lo -= padY; hi += padY;

  const X = t => pad + (t - t0) / HIST_MS * (W - pad * 2);
  const Y = v => H - pad - (v - lo) / (hi - lo) * (H - pad * 2);

  /* target line */
  if (last.target > 0) {
    ctx.strokeStyle = '#e45b24'; ctx.setLineDash([4, 4]); ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(pad, Y(last.target)); ctx.lineTo(W - pad, Y(last.target)); ctx.stroke();
    ctx.setLineDash([]);
  }

  /* series */
  ctx.strokeStyle = '#3fb950'; ctx.lineWidth = 2; ctx.lineJoin = 'round';
  ctx.beginPath();
  hist.forEach((p, i) => { const x = X(p.t), y = Y(p.w); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
  ctx.stroke();

  /* last dot */
  const lp = hist[hist.length - 1];
  ctx.fillStyle = '#3fb950';
  ctx.beginPath(); ctx.arc(X(lp.t), Y(lp.w), 3, 0, 7); ctx.fill();

  /* axis labels */
  ctx.fillStyle = '#7d8590'; ctx.font = '10px Consolas'; ctx.textAlign = 'left';
  ctx.fillText(hi.toFixed(0), pad + 2, 12);
  ctx.fillText(lo.toFixed(0), pad + 2, H - 4);
}

/* ---------- commands ------------------------------------------------- */
async function send(cmd) {
  if (mode === 'wifi') {
    try {
      await fetch(`${base}/api/cmd?do=${encodeURIComponent(cmd.split(' ')[0])}`);
      log('→ ' + cmd);
    } catch (e) { log('发送失败：' + e.message); }
  } else if (mode === 'usb' && writer) {
    try {
      await writer.write(new TextEncoder().encode(cmd + '\n'));
      log('→ ' + cmd);
    } catch (e) { log('串口写入失败：' + e.message); }
  }
}

async function sendRatio(v) {
  if (mode === 'wifi') {
    try { await fetch(`${base}/api/ratio?v=${v}`); log('→ ratio ' + v); }
    catch (e) { log('发送失败：' + e.message); }
  } else if (mode === 'usb' && writer) {
    await writer.write(new TextEncoder().encode('ratio ' + v + '\n'));
    log('→ ratio ' + v);
  }
}

/* ---------- USB (Web Serial) ----------------------------------------- */
async function connectUsb() {
  if (!('serial' in navigator)) {
    alert('这个浏览器没有 Web Serial。\n用 Chrome 或 Edge 打开本页面。');
    return;
  }
  try {
    const port = await navigator.serial.requestPort();
    await port.open({ baudRate: 115200 });

    writer = port.writable.getWriter();
    mode = 'usb';
    setLink('USB 已连接', 'on');
    conn.classList.remove('show');
    log('串口打开 115200');

    /* read loop */
    const dec = new TextDecoderStream();
    port.readable.pipeTo(dec.writable).catch(() => {});
    const reader = dec.readable.getReader();
    let buf = '';

    (async function pump() {
      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += value;
        let nl;
        while ((nl = buf.indexOf('\n')) >= 0) {
          const line = buf.slice(0, nl).trim();
          buf = buf.slice(nl + 1);
          handleLine(line);
        }
      }
    })();

    /* ask for one state line right away */
    setTimeout(() => send('status'), 400);
  } catch (e) {
    log('USB 连接取消或失败：' + e.message);
  }
}

function handleLine(line) {
  if (!line) return;
  if (line[0] === '{') {
    try { render(JSON.parse(line)); return; } catch (e) { /* fall through */ }
  }
  log(line);
}

/* ---------- WiFi ----------------------------------------------------- */
function connectWifi() {
  base = ('http://' + $('ip').value.trim().replace(/^https?:\/\//, '')).replace(/\/$/, '');
  mode = 'wifi';
  setLink('连接中…', '');
  log('尝试 ' + base);

  poll();
  pollTimer = setInterval(poll, 800);
  conn.classList.remove('show');
}

async function poll() {
  try {
    const r = await fetch(`${base}/api/state`, { cache: 'no-store' });
    const j = await r.json();
    render(j);
    if (link.textContent !== base.replace('http://', '')) setLink(base.replace('http://', ''), 'on');
  } catch (e) {
    setLink('连不上', 'off');
  }
}

function setLink(text, cls) {
  link.textContent = text;
  link.className = 'pill' + (cls ? ' ' + cls : '');
}

/* ---------- wiring --------------------------------------------------- */
$('btnUsb').onclick    = connectUsb;
$('btnWifiGo').onclick = connectWifi;
$('bStart').onclick    = () => send('start');
$('bStop').onclick     = () => send('stop');
$('bTare').onclick     = () => send('tare');
$('bClear').onclick    = () => send('clear');
$('bRatio').onclick    = () => sendRatio($('ri').value);

/* Enter in the IP box connects */
$('ip').addEventListener('keydown', e => { if (e.key === 'Enter') connectWifi(); });

/* start on the picker */
setLink('未连接', 'off');
log('选一种连接方式开始');
</script>
</body>
</html>
