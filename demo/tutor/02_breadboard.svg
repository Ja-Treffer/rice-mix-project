<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="930" viewBox="0 0 1400 930">
<rect width="1400" height="930" fill="#ffffff"/>
<text x="48" y="52" fill="#1A1A1A" font-size="30" font-family="Segoe UI, Arial, sans-serif" text-anchor="start" font-weight="700">面包板怎么通</text>
<text x="48" y="80" fill="#6E6A64" font-size="14" font-family="Segoe UI, Arial, sans-serif" text-anchor="start">孔与孔之间只有三种关系。记住这三条，后面怎么插都不会错。</text>
<rect x="48" y="96" width="200" height="5" fill="#E85D26"/>
<text x="48" y="148" fill="#1A1A1A" font-size="19" font-family="Segoe UI, Arial, sans-serif" text-anchor="start" font-weight="700">规则一 · 同一列的 5 个孔是通的</text>
<text x="48" y="172" fill="#6E6A64" font-size="13" font-family="Segoe UI, Arial, sans-serif" text-anchor="start">上半部分标 a b c d e，这 5 个孔内部连在一起。下半部分 f g h i j 同理。</text>
