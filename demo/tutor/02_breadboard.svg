<text x="384" y="260" fill="#E85D26" font-size="14" font-family="Segoe UI, Arial, sans-serif" text-anchor="start" font-weight="700">← 这一列的 5 个孔</text>
<text x="384" y="284" fill="#6E6A64" font-size="12.5" font-family="Segoe UI, Arial, sans-serif" text-anchor="start">   内部是连在一起的</text>
<text x="384" y="312" fill="#6E6A64" font-size="12.5" font-family="Segoe UI, Arial, sans-serif" text-anchor="start">   插进 a，从 e 也通</text>
<rect x="760" y="190" width="590" height="200" fill="#FCFBF9" stroke="#E2DDD3" stroke-width="1.6" rx="8"/>
<text x="786" y="224" fill="#1A1A1A" font-size="15" font-family="Segoe UI, Arial, sans-serif" text-anchor="start" font-weight="700">怎么用这条</text>
<text x="786" y="252" fill="#1A1A1A" font-size="13" font-family="Segoe UI, Arial, sans-serif" text-anchor="start">· 一个器件插在 a–e 上，它的另外几个脚是通的。</text>
<text x="786" y="276" fill="#1A1A1A" font-size="13" font-family="Segoe UI, Arial, sans-serif" text-anchor="start">· 一根线从 Arduino 过来，插这一列任意一孔都行。</text>
<text x="786" y="300" fill="#1A1A1A" font-size="13" font-family="Segoe UI, Arial, sans-serif" text-anchor="start">· 5 个脚以上的器件（比如 595）要跨到下半部分，</text>
<text x="786" y="322" fill="#C8342A" font-size="13" font-family="Segoe UI, Arial, sans-serif" text-anchor="start">  因为两排不连通。</text>
<text x="48" y="640" fill="#1A1A1A" font-size="19" font-family="Segoe UI, Arial, sans-serif" text-anchor="start" font-weight="700">规则二 · 电源轨整条是通的</text>
<text x="48" y="664" fill="#6E6A64" font-size="13" font-family="Segoe UI, Arial, sans-serif" text-anchor="start">板子上下各有两条带颜色的长条（红 / 蓝），同一颜色整条连在一起。</text>
<text x="48" y="686" fill="#1A1A1A" font-size="12" font-family="Segoe UI, Arial, sans-serif" text-anchor="start"></text>
