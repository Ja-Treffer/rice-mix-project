<text x="372" y="764" fill="#1E5FA8" font-size="13" font-family="Segoe UI, Arial, sans-serif" text-anchor="start" font-weight="700">◀ 蓝条 = GND</text>
<rect x="760" y="690" width="590" height="190" fill="#FCFBF9" stroke="#E2DDD3" stroke-width="1.6" rx="8"/>
<text x="786" y="722" fill="#1A1A1A" font-size="15" font-family="Segoe UI, Arial, sans-serif" text-anchor="start" font-weight="700">为什么要有它</text>
<text x="786" y="750" fill="#1A1A1A" font-size="13" font-family="Segoe UI, Arial, sans-serif" text-anchor="start">省线。5V 和 GND 各只需从 Arduino 引一根过来，</text>
<text x="786" y="772" fill="#1A1A1A" font-size="13" font-family="Segoe UI, Arial, sans-serif" text-anchor="start">其他要用电的器件就近插到条上就行。</text>
<text x="786" y="802" fill="#C8342A" font-size="13" font-family="Segoe UI, Arial, sans-serif" text-anchor="start" font-weight="700">⚠ 830 孔的大板，红条中间会断一次（左右不通）。</text>
<text x="786" y="824" fill="#6E6A64" font-size="12.5" font-family="Segoe UI, Arial, sans-serif" text-anchor="start">   接之前用万用表量一下，或者干脆左右各接一根。</text>
<text x="786" y="856" fill="#C8342A" font-size="13" font-family="Segoe UI, Arial, sans-serif" text-anchor="start" font-weight="700">⚠ 红条和蓝条之间千万不能通，通了就是短路。</text>
