<text x="30" y="796" font-family="ui-monospace,Consolas,monospace" fill="#3ddc97" font-size="10.5">装配顺序：底板钻孔 → 支座 4×M3 自攻 → 梁固定端 2×M4 → M4 铜柱 6mm → 秤台 1×M4 → 3 个定位销 → 管架底座 M4 → Ø8 立杆插入 → 横臂套上锁 M3 → 容器围挡插接</text>
